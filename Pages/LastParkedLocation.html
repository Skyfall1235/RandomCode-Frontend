<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parked Location Tracker | Wyatt M.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;800&display=swap");

      body {
        font-family: "Inter", sans-serif;
        background-color: #09090b;
        color: #fafafa;
      }

      .mono {
        font-family: "Fira Code", monospace;
      }

      .scanline {
        width: 100%;
        height: 2px;
        background: rgba(59, 130, 246, 0.05);
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        animation: moveScanline 8s linear infinite;
      }

      @keyframes moveScanline {
        0% { top: 0; }
        100% { top: 100%; }
      }

      input, select, textarea {
        background: #18181b !important;
        border: 1px solid #27272a !important;
        color: #fafafa !important;
      }

      input:focus, select:focus, textarea:focus {
        border-color: #3b82f6 !important;
        outline: none;
        box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.2);
      }

      .card {
        background: #09090b;
        border: 1px solid #27272a;
      }

      .tab-active {
        border-bottom: 2px solid #3b82f6;
        color: #3b82f6;
      }

      .hidden-section {
        display: none;
      }
    </style>
  </head>
  <body class="min-h-screen p-6 md:p-12 relative overflow-x-hidden">
    <div class="scanline"></div>

    <div class="max-w-4xl mx-auto">
      <!-- Back Link -->
      <a href="../index.html" class="inline-flex items-center gap-2 text-zinc-500 hover:text-blue-500 transition-colors mono text-xs mb-8">
        <i class="fas fa-arrow-left"></i> RETURN_TO_DASHBOARD
      </a>

      <!-- Header -->
      <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-end gap-4 border-b border-zinc-800 pb-8">
        <div>
          <h1 class="text-3xl font-extrabold tracking-tight mono">
            VehicleTracker<span class="text-blue-500 text-xl">_</span>
          </h1>
          <p class="text-zinc-500 text-sm mt-1 italic italic">/api/LastParkedLocation</p>
        </div>
        
        <!-- Tab Navigation -->
        <nav class="flex gap-6 mono text-xs">
          <button onclick="switchTab('register')" id="tab-register" class="pb-2 tab-active transition-all">REGISTER_LOCATION</button>
          <button onclick="switchTab('locate')" id="tab-locate" class="pb-2 text-zinc-500 hover:text-zinc-300 transition-all">LOCATE_VEHICLE</button>
        </nav>
      </header>

      <!-- REGISTER SECTION (POST) -->
      <section id="section-register" class="space-y-6">
        <div class="card p-8 rounded-lg relative overflow-hidden">
          <div class="flex items-center gap-2 mb-6 text-emerald-500 mono text-xs">
            <span class="bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">POST</span>
            <span>PUSH_TO_CLOUD_STORAGE</span>
          </div>

          <form id="parkingForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
              <label class="block text-[10px] mono text-zinc-500 uppercase">Vehicle_ID</label>
              <select id="VehicleId" name="VehicleId" class="w-full p-2.5 rounded text-sm" required>
                <option value="sedan-01">Daily Driver (Sedan)</option>
                <option value="truck-01">Off-road (Truck)</option>
                <option value="other">Other/Guest</option>
              </select>
            </div>

            <div class="space-y-2">
              <label class="block text-[10px] mono text-zinc-500 uppercase">GPS_COORDINATES</label>
              <button type="button" onclick="getLocation()" class="w-full bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded text-xs font-bold flex items-center justify-center gap-2 transition-all">
                <i class="fas fa-location-crosshairs"></i> FETCH_CURRENT_LOCATION
              </button>
            </div>

            <div class="space-y-2">
              <label class="block text-[10px] mono text-zinc-500 uppercase tracking-widest text-zinc-600">Lat/Long</label>
              <div class="grid grid-cols-2 gap-2">
                <input type="text" id="Latitude" name="Latitude" placeholder="Latitude" readonly class="p-2.5 rounded text-xs mono opacity-60" required />
                <input type="text" id="Longitude" name="Longitude" placeholder="Longitude" readonly class="p-2.5 rounded text-xs mono opacity-60" required />
              </div>
            </div>

            <div class="space-y-2">
              <label class="block text-[10px] mono text-zinc-500 uppercase">GPS_Accuracy (m)</label>
              <input type="number" id="Accuracy" name="Accuracy" step="0.1" class="w-full p-2.5 rounded text-sm mono" placeholder="0.0" readonly />
            </div>

            <div class="space-y-2">
              <label class="block text-[10px] mono text-zinc-500 uppercase">Floor_Level</label>
              <input type="number" id="FloorLevel" name="FloorLevel" class="w-full p-2.5 rounded text-sm" placeholder="e.g. 3" />
            </div>

            <div class="space-y-2">
              <label class="block text-[10px] mono text-zinc-500 uppercase">Section/Spot</label>
              <input type="text" id="Section" name="Section" class="w-full p-2.5 rounded text-sm" placeholder="e.g. B-12" />
            </div>

            <div class="md:col-span-2 space-y-2">
              <label class="block text-[10px] mono text-zinc-500 uppercase">Notes</label>
              <textarea id="Notes" name="Notes" rows="2" class="w-full p-2.5 rounded text-sm" placeholder="Near the elevators..."></textarea>
            </div>

            <div class="md:col-span-2 space-y-2">
              <label class="block text-[10px] mono text-zinc-500 uppercase">Photo_Attachment</label>
              <div id="photo-preview-container" class="hidden mb-2 w-full h-48 bg-zinc-900 rounded border border-zinc-800 flex items-center justify-center overflow-hidden">
                <img id="photo-preview" src="#" alt="Preview" class="max-h-full object-contain" />
              </div>
              <input type="file" id="Photo" name="Photo" accept="image/*" capture="environment" class="w-full p-2 rounded text-xs file:bg-zinc-800 file:border-none file:text-white file:px-4 file:py-1 file:rounded file:mr-4 file:cursor-pointer hover:file:bg-zinc-700" onchange="previewImage(this)" />
            </div>

            <button type="submit" class="md:col-span-2 mt-4 bg-zinc-100 hover:bg-white text-black p-4 rounded font-bold mono text-sm flex items-center justify-center gap-2 transition-all">
              <i class="fas fa-cloud-upload"></i> EXECUTE_SUBMISSION
            </button>
          </form>
        </div>
      </section>

      <!-- LOCATE SECTION (GET) -->
      <section id="section-locate" class="hidden-section space-y-6">
        <div class="card p-8 rounded-lg">
          <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-2 text-blue-500 mono text-xs">
                <span class="bg-blue-500/10 px-2 py-0.5 rounded border border-blue-500/20">GET</span>
                <span>FETCH_LAST_RECORD</span>
            </div>
            <select id="locate-vehicle-id" onchange="fetchCurrentLocationData()" class="p-1.5 rounded text-[10px] mono">
                <option value="sedan-01">sedan-01</option>
                <option value="truck-01">truck-01</option>
            </select>
          </div>

          <div id="status-display" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2 h-64 bg-zinc-900 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-700 mono text-[10px] relative overflow-hidden group">
               <div id="map-placeholder" class="text-center">
                 <i class="fas fa-map-marked-alt text-4xl mb-2 opacity-20"></i><br>
                 MAP_OR_IMAGE_PENDING
               </div>
               <!-- Removed 'hidden' class so JS can show/hide it -->
               <img id="latest-image" src="" class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity" />
            </div>

            <div class="space-y-4">
              <div class="border-l-2 border-blue-500 pl-4 py-1">
                <div class="text-[10px] text-zinc-500 mono uppercase">Timestamp</div>
                <div id="display-time" class="text-sm font-semibold italic">--:--</div>
              </div>
              <div class="border-l-2 border-zinc-800 pl-4 py-1">
                <div class="text-[10px] text-zinc-500 mono uppercase">Floor / Section</div>
                <div id="display-floor" class="text-sm font-semibold">N/A</div>
              </div>
              <div class="border-l-2 border-zinc-800 pl-4 py-1">
                <div class="text-[10px] text-zinc-500 mono uppercase">Notes</div>
                <div id="display-notes" class="text-xs text-zinc-400">...</div>
              </div>
              <a id="google-maps-link" href="#" target="_blank" class="block w-full text-center bg-zinc-900 border border-zinc-800 hover:border-blue-500/50 py-2 rounded text-[10px] mono transition-colors">
                <i class="fas fa-external-link-alt mr-2"></i>OPEN_IN_MAPS
              </a>
            </div>
          </div>

          <div class="mt-10 pt-6 border-t border-zinc-900 flex gap-4">
             <button onclick="fetchCurrentLocationData()" class="text-xs mono text-blue-500 hover:text-blue-400">
               <i class="fas fa-sync-alt mr-1"></i> REFRESH_NODE
             </button>
          </div>
        </div>
      </section>

      <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded bg-zinc-800 border border-zinc-700 text-xs mono hidden shadow-2xl z-50">
        <span id="toast-message"></span>
      </div>
    </div>

    <script>
      // CONFIG: Match your Visual Studio port
      const BASE_URL = 'https://localhost:7192';

      function switchTab(tab) {
        const regSection = document.getElementById('section-register');
        const locateSection = document.getElementById('section-locate');
        const regTab = document.getElementById('tab-register');
        const locateTab = document.getElementById('tab-locate');

        if (tab === 'register') {
          regSection.classList.remove('hidden-section');
          locateSection.classList.add('hidden-section');
          regTab.classList.add('tab-active');
          locateTab.classList.remove('tab-active');
        } else {
          regSection.classList.add('hidden-section');
          locateSection.classList.remove('hidden-section');
          locateTab.classList.add('tab-active');
          regTab.classList.remove('tab-active');
          fetchCurrentLocationData();
        }
      }

      function getLocation() {
        showToast("INITIALIZING_GPS...");
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              document.getElementById('Latitude').value = position.coords.latitude.toFixed(6);
              document.getElementById('Longitude').value = position.coords.longitude.toFixed(6);
              document.getElementById('Accuracy').value = position.coords.accuracy.toFixed(1);
              showToast("GPS_LOCKED", "success");
            },
            (err) => showToast("GPS_ERR: " + err.message, "error"),
            { enableHighAccuracy: true }
          );
        }
      }

      function previewImage(input) {
        const preview = document.getElementById('photo-preview');
        const container = document.getElementById('photo-preview-container');
        if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = (e) => {
            preview.src = e.target.result;
            container.classList.remove('hidden');
          }
          reader.readAsDataURL(input.files[0]);
        }
      }

      document.getElementById('parkingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        showToast("UPLOADING...");

        try {
          const response = await fetch(`${BASE_URL}/api/LastParkedLocation`, {
            method: 'POST',
            body: formData
          });

          if (response.ok) {
            showToast("SUCCESS", "success");
            e.target.reset();
            document.getElementById('photo-preview-container').classList.add('hidden');
          } else {
            showToast("ERROR: " + response.status, "error");
          }
        } catch (err) {
          showToast("CORS_OR_NETWORK_ERR", "error");
        }
      });

      async function fetchCurrentLocationData() {
        const vehicleId = document.getElementById('locate-vehicle-id').value;
        const url = `${BASE_URL}/api/LastParkedLocation/get-current/${vehicleId}`;
        const imgUrl = `${BASE_URL}/api/LastParkedLocation/get-current-image/${vehicleId}`;
        
        try {
          // 1. Fetch Text Data
          const res = await fetch(url);
          const data = await res.json();
          console.log("DEBUG: API Response", data); // CHECK CASE SENSITIVITY HERE IN F12

          // 2. Fetch Image Data
          const imgRes = await fetch(imgUrl);
          let imgBlob = null;
          if(imgRes.ok) {
            imgBlob = await imgRes.blob();
          }
          
          updateDisplay(data, imgBlob);
        } catch (err) {
          console.error(err);
          showToast("FETCH_ERROR", "error");
        }
      }

      function updateDisplay(data, imgBlob) {
        // Use Optional Chaining (?.) or camelCase check based on your C# settings
        // If your C# is returning PascalCase, change these to .ParkedAt, .FloorLevel, etc.
        document.getElementById('display-time').innerText = data.parkedAt || "N/A";
        
        const floor = data.floorLevel || "?";
        const section = data.section || "?";
        document.getElementById('display-floor').innerText = `FLOOR ${floor} / ${section}`;
        document.getElementById('display-notes').innerText = data.notes || "No notes.";
        document.getElementById('google-maps-link').href = data.googleMapsUrl || "#";

        const imgElement = document.getElementById('latest-image');
        const placeholder = document.getElementById('map-placeholder');

        if (imgBlob && imgBlob.size > 0) {
          imgElement.src = URL.createObjectURL(imgBlob);
          imgElement.classList.add('opacity-100');
          imgElement.classList.remove('opacity-0');
          placeholder.classList.add('hidden');
        } else {
          imgElement.classList.add('opacity-0');
          placeholder.classList.remove('hidden');
        }
      }

      function showToast(msg, type = 'info') {
        const toast = document.getElementById('toast');
        const text = document.getElementById('toast-message');
        text.innerText = msg;
        toast.style.borderColor = type === 'success' ? '#10b981' : (type === 'error' ? '#ef4444' : '#27272a');
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 3000);
      }
    </script>
  </body>
</html>
